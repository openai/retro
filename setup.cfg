[pycodestyle]
exclude = third-party,cores,docker/linux
ignore = E501

[tool:pytest]
norecursedirs = third-party cores

[metadata]
classifiers = 
Programming Language :: Python :: 3.8
Programming Language :: Python :: 3.9
Programming Language :: Python :: 3.10
Programming Language :: Python :: 3.11

[options]
python_requires = >=3.8